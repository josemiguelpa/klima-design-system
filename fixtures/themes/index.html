<!doctype html>
<html lang="es" data-brand="sole" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solé theme fixture</title>
  </head>
  <body>
    <header class="bar">
      <h1>Tema Solé</h1>
      <button type="button" class="toggle" data-theme-toggle aria-pressed="false">
        Modo oscuro
      </button>
    </header>
    <main class="content">
      <section class="surface">
        <h2>Superficie</h2>
        <p class="body">Texto de cuerpo sobre una superficie del tema.</p>
        <p class="secondary">Texto secundario.</p>
        <button type="button" class="action">Acción primaria</button>
      </section>
      <section class="feedback">
        <p class="message success">Operación completada.</p>
        <p class="message info">Información relevante.</p>
        <p class="message warning">Revisa esta configuración.</p>
        <p class="message critical">No se pudo guardar.</p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
